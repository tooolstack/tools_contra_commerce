services:
  tools-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        NEXT_PUBLIC_TOOLS_DOMAIN: ${BASE_DOMAIN}
        NEXT_PUBLIC_TRACK_ENDPOINT: /api/event
    env_file:
      - apps/web/.env.staging
    command: ["npm", "run", "db:migrate"]
    restart: "no"

  tools:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TOOLS_DOMAIN: ${BASE_DOMAIN}
        NEXT_PUBLIC_TRACK_ENDPOINT: /api/event
    image: ${TOOLS_IMAGE:-contra-commerce-tools:staging}
    env_file:
      - apps/web/.env.staging
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      tools-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      start_period: 20s
      retries: 5

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
    env_file:
      - deploy/staging.env
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy-data:/data
      - ./deploy/caddy-config:/config
    depends_on:
      tools:
        condition: service_healthy

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./deploy/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/prometheus-data:/prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - blackbox
